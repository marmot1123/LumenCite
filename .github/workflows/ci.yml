name: CI

# PR / push 用の軽量チェック（CR-030）。以前は release ワークフローしか無く、476 の Rust
# テストも拡張機能テストも PR で走らなかったため、P0（Trash purge）やコマンド未登録を検出
# できなかった。ここで frontend ビルド・Rust テスト/clippy・拡張テスト/ビルドを回す。
#
# 追補予定（本 PR のスコープ外）: frontend の unit/E2E（Playwright/Tauri）と、
# frontend の invoke() 名と Rust handler 登録を突き合わせる contract テスト。

on:
  pull_request:
  push:
    branches: [main]

# 同一 ref の古い実行はキャンセルして無駄なランナー消費を避ける。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build + extension tests
    runs-on: ubuntu-22.04
    # 実測 3 分前後。ハングしたときに GitHub 既定の 360 分（6 時間）を燃やさないための上限で、
    # 「遅いから落とす」ための値ではないので実測の 5 倍ほど余裕を取る。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check + build frontend
        run: pnpm build
      - name: Extension tests
        run: pnpm --filter lumencite-clipper test
      - name: Extension build
        run: pnpm --filter lumencite-clipper build

  rust:
    name: Rust test + clippy
    runs-on: ubuntu-22.04
    # 実測 3〜4 分（apt 25 秒 + cargo test 95〜135 秒 + clippy 30〜37 秒）。
    # **2026-08-07 に `Install Linux dependencies` が 20 分以上返らない実行が出た**
    # （apt ミラーの一過性の不調・GitHub 側の障害報告は無し）。上限が無いと 6 時間走る。
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: cargo test
        working-directory: src-tauri
        run: cargo test
      # ベースラインの警告は解消済み（CR-039）なので -D warnings で回帰を止める。
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      # 依存の既知脆弱性を可視化する（CR-031）。
      #
      # 既知・評価済みの advisory は --ignore で明示的に除外する。理由は「exit 1 を
      # 意味のあるシグナルに戻す」ため: 恒常的に exit 1 だと continue-on-error でも
      # GitHub UI に `Process completed with exit code 1.` の failure アノテーションが
      # 出続け、**新しい advisory が増えても見分けがつかない**。除外した後は
      # 「赤 = 未評価の新しい advisory」になる。
      #
      # **2 パスで回す**: `--ignore` した advisory は出力からも完全に消えるため、
      # 1 回目に除外なしで全件をログへ出し（exit code は捨てる）、2 回目の除外つき実行を
      # ステップの exit code にする。可視性（CR-031 の「内容はログで確認する」）と
      # シグナル性を両立させるため。
      #
      # 除外中の advisory（棚卸し: 2026-07-28）:
      #   RUSTSEC-2026-0194 / RUSTSEC-2026-0195 — quick-xml 0.39.3（いずれも 7.5 high・DoS）
      #     経路: wayland-scanner(proc-macro) → wayland-client → … → arboard →
      #     tauri-plugin-clipboard-manager。**Linux 限定のビルド時依存**で、解析対象は
      #     同梱の信頼済み Wayland プロトコル XML のみ。実行時に未信頼入力を食わせる面が無い。
      #     Solution は >=0.41.0 で、tauri 側（plist 経由）は既に 0.41.0 を使っている。
      #     wayland-scanner の upstream 更新待ち。
      #   RUSTSEC-2023-0071 — rsa 0.9.10（5.9 medium・Marvin Attack・**修正版なし**）
      #     経路: sqlx-mysql のみ。本アプリは sqlx の backend に sqlite しか有効化していない
      #     （Cargo.toml の features = ["sqlite","runtime-tokio","macros","migrate"]）ため
      #     `cargo tree -i rsa --target all` は 0 件＝**コンパイルも link もされない**。
      #     Cargo.lock には optional backend として名前だけ残っている。
      #
      # unmaintained / unsound / yanked は warning 扱いで exit code に影響しないため除外不要。
      # 除外リストは依存を大きく動かしたときに棚卸しする（消えた ID は削る）。
      # PR を止めない方針は据え置き（continue-on-error のまま）。
      - name: cargo audit (advisory, non-blocking)
        working-directory: src-tauri
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked || true
          echo "::group::cargo audit (全件・除外なし・情報表示)"
          cargo audit || true
          echo "::endgroup::"
          # 除外つきの結果がこのステップの exit code になる（赤 = 未評価の新しい advisory）
          cargo audit \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195 \
            --ignore RUSTSEC-2023-0071
