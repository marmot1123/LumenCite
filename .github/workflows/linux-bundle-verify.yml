name: Linux bundle verify

# Linux 配布物の pdfium 同梱を、**実際に配布物を作って中で動かして**確かめる
# （v1.0.0-p0 の残作業・docs/LCIR_REMAINING_PHASES.md §2.6-5）。
#
# release.yml にも静的検査（成果物を展開して libpdfium.so の位置を見る）は入っているが、
# 「探索候補と実配置が噛み合っているか」は動かさないと分からない ── 探索先は配布形態で変わる
# （deb は /usr/lib/<name>/、AppImage は $APPDIR/usr/lib/<name>/）。ここでは .deb を実際に
# インストールし、.AppImage を自己展開して、その中で `bind_pdfium()` を回す。
#
# 手動実行と、**同梱の前提に触る PR** で走る。1 回あたり約 12 分（rust-cache 冷）/ 約 7 分（温）
# ── 2026-08-07 実測 ── かかるので paths を絞り、通常の PR では回さない（普段の PR は ci.yml だけ）。
# **リリースは作らない**（成果物はアップロードもしない）。
#
# paths に挙げているのは「この検査の答えを変えうるファイル」:
#   pdfium.rs                     探索候補そのもの（library_search_dirs）
#   tauri.release-linux.conf.json 同梱先（bundle.resources）
#   tauri.conf.json               productName ＝ 実行時のリソースディレクトリ名
#   .github/pdfium.env            pdfium の版と検証ハッシュ（正本）
#   release.yml                   取得ステップそのもの
# 片方だけ変えると検査が通ったまま実機で落ちるので、対で見直せるようにここに並べる。

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/pdfium.env"
      - "src-tauri/src/ingestion/pdf/pdfium.rs"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/tauri.release-linux.conf.json"
      - "src-tauri/examples/pdfium_probe.rs"
      - "scripts/verify_linux_bundle.sh"
      - "scripts/verify_linux_bundle_runtime.sh"
      - ".github/workflows/linux-bundle-verify.yml"
      - ".github/workflows/release.yml"

concurrency:
  group: linux-bundle-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build Linux bundles and bind pdfium inside them
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libarchive-tools

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # release.yml の Linux ジョブと**同じ正本**（.github/pdfium.env）から取る。
      # 以前はここに値を複製しており、pdfium を上げたとき検証側だけ古い版を掴んで
      # 緑になる穴があった（PR #92 のレビュー指摘）。
      - name: Download and verify pdfium (Linux)
        run: |
          . .github/pdfium.env
          mkdir -p src-tauri/pdfium tmp-pdfium
          curl -fL -o tmp-pdfium/pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_TAG}/pdfium-linux-x64.tgz"
          echo "${PDFIUM_SHA256_LINUX}  tmp-pdfium/pdfium.tgz" | sha256sum -c -
          tar -xzf tmp-pdfium/pdfium.tgz -C tmp-pdfium
          cp tmp-pdfium/lib/libpdfium.so src-tauri/pdfium/libpdfium.so
          rm -rf tmp-pdfium

      # 出荷と同じ --config オーバーレイでバンドルする（bundle.resources → /usr/lib/LumenCite/）。
      # .rpm は作らない（実行時検証の対象は .deb と .AppImage の 2 つ・§2.6-5）。
      #
      # 2 枚目の --config で updater 成果物を切る。**署名鍵をこのジョブに渡さないため**で、
      # updater 成果物は各バンドルの隣に並ぶ .sig（.AppImage.sig / .deb.sig / .rpm.sig）＝
      # バンドル本体のバイト列は変わらない。--config は「後勝ちで順にマージ」される。
      - name: Build Linux bundles
        run: |
          pnpm tauri build \
            --config src-tauri/tauri.release-linux.conf.json \
            --config '{"bundle":{"createUpdaterArtifacts":false}}' \
            --bundles deb,appimage

      # (i) 静的検査 — release.yml が毎回回すのと同じスクリプト。
      - name: Verify pdfium is bundled (static)
        run: ./scripts/verify_linux_bundle.sh src-tauri/target/release/bundle

      # (ii) 実行時検証 — 配布物の中で bind_pdfium() を実際に呼ぶ。
      - name: Build pdfium probe
        working-directory: src-tauri
        run: cargo build --release --example pdfium_probe

      - name: Verify bind_pdfium() inside the real bundles (runtime)
        run: |
          ./scripts/verify_linux_bundle_runtime.sh \
            src-tauri/target/release/examples/pdfium_probe \
            src-tauri/target/release/bundle
